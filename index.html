    <H1>Bat Ball Stump Game</H1>

        <button class="bat" onclick="
            // console.log('You chose Bat!')

            // console.log('Computer chose ' + computerChoice)

        <button class="ball" onclick="
            // console.log('You chose Ball!')

            // console.log('You chose Stump!')
